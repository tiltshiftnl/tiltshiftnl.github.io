{% assign klanten = site.klanten | where_exp: "klant", "klant.featured != true" | sort: "order" %}

<div class="container-md ">
    <div class="logos even-blocks-grid margin-y">
        {% for klant in klanten %}
            <a class="logo-block" href="{{ klant.url }}" title="{{ klant.title }}">
                {% if klant.logo %}<img src="{{ klant.logo }}" alt="{{ klant.title }}"{% if klant.logo_width %} style="width: {{ klant.logo_width }}px"{% endif %}>{% else %}<span class="logo-block__naam">{{ klant.title }}</span>{% endif %}
            </a>
        {% endfor %}
    </div>
</div>
