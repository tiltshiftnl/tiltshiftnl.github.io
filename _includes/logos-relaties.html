{% assign klanten = site.klanten | where_exp: "klant", "klant.logo" | where_exp: "klant", "klant.featured != true" | sort: "order" %}

<div class="container-md ">
    <div class="logos even-blocks-grid margin-y">
        {% for klant in klanten %}
            <div class="logo-block">
                <img src="{{ klant.logo }}" alt="{{ klant.title }}">
            </div>
        {% endfor %}
    </div>
</div>
