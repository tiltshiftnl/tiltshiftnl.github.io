# Reeksen van workshops (zie _includes/reeks.html). Een workshop hoort bij een reeks met
# `reeks:`, `reeks_stap:` en `reeks_moment:` in de front matter; de sleutel hieronder is de waarde van `reeks:`.
# Deze tekst staat zowel op /workshops/ als op elke workshoppagina van de reeks.

publieke-code:
  label: "Opensourcewerken"
  kop: "Belangrijke momenten in een publiek softwareproject"
  tekst: "Drie workshops voor opensourcewerken: bij de start, als je gaat samenwerken, en tussentijds of bij oplevering. Elke workshop kan los. Samen houden ze de codebase open, herbruikbaar, leesbaar, te verantwoorden, toegankelijk en duurzaam."
  # Onder de workshops van de reeks: logo's van verenigingen (sleutels uit _data/lidmaatschappen.yml)
  lidmaatschappen: [dosba, opennederland]
  lidmaatschappen_tekst: "Tiltshift is lid van de Dutch Open Source Business Alliance en van Vereniging Open Nederland."
